[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# Foundry v1.8+ understands Monad execution semantics natively.
network = "monad"
# Default public-chain target for this hackathon is Monad Testnet.
eth_rpc_url = "https://testnet-rpc.monad.xyz"
chain_id = 10143

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad = "https://rpc.monad.xyz"

[fmt]
line_length = 120
tab_width = 4
